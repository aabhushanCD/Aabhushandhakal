<!DOCTYPE html>
<html lang="en">

<head>

    <title>Todo</title>

    <style>
        body {

            background-color: rgb(1, 2, 2);
            font-family: arial;
            color: antiquewhite;
        }

        #main-heading {
            text-align: center;
        }

        #todoInput,
        #todo-date {

            font-size: 15px;
            padding: 10px 5px;
            border-radius: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 400px 150px 100px;
            column-gap: 10px;
            row-gap: 15px;
            justify-content: center;
            
        }

        /* #todo-date{
            border-radius: 15px;
            height:50px;
            font-size:15px;
           
        } */

        .btn-todo {
            background-color: rgb(73, 197, 73);
            color: rgb(255, 255, 255);
            border-radius: 10px;
            border: none;
            padding: 15px 0px;
            cursor: pointer;
        }
        .todo-container{
            margin-left:270px;
        }

        .btn-delete {
            background-color: rgb(42, 1, 1);
            color: rgb(187, 172, 152);
            border-radius: 10px;
            border: none;
            padding: 15px 0px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 id="main-heading">Todo App</h1>

    <div class="grid-container">
        <input id="todoInput" type="text" placeholder="Enter Todo here">
        <input id="todo-date" type="date">
        <button class="btn-todo" onclick="addTodo();"> Add</button>
        <div class="todo-container grid-container"></div>
    </div>

    <script> let todoList = JSON.parse(localStorage.getItem("todoList")) || [];
        function addTodo() {
            let inputElements = document.querySelector("#todoInput");

            let dateElements = document.querySelector("#todo-date");

            let todoItem = inputElements.value;
            let todoDate = dateElements.value;
            todoList.push({ item: todoItem, duedate: todoDate });
            inputElements.value = "";
            dateElements.value = "";
            localStorage.setItem("todoList", JSON.stringify(todoList));
            displayItems();
        }

        function displayItems() {
            let containerElement = document.querySelector(".todo-container");
            let newHtml = "";
            for (let i = 0; i < todoList.length; i++) {
                let { item, duedate } = todoList[i];
                newHtml += `
                <span>${item}</span>
                <span>${duedate}</span>
                <button class="btn-delete" onclick = "todoList.splice(${i},1);
                localStorage.setItem('todoList', JSON.stringify(todoList));
                displayItems();">Delete</button>
                `;
            }
            containerElement.innerHTML = newHtml;
        }
        displayItems();
    </script>
</body>

</html>
